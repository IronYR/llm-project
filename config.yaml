llm:
  provider: ollama
  backend: ollama
  model: qwen2.5:3b
  base_url: http://localhost:11434
  temperature: 0.3
  max_tokens: 600
  stream: true
  fallback_model: mistral:latest
  hf_model_id: Qwen/Qwen2.5-3B-Instruct
  use_lora: true
  load_in_4bit: true

finetune:
  base_model_id: Qwen/Qwen2.5-3B-Instruct
  output_dir: ./models/lora_nust_bank
  num_epochs: 2
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  max_seq_length: 2048
  use_4bit: true
  use_mps: false   # Mac: keep false to avoid MPS "Invalid buffer size" on large loads; use CUDA for fast 4-bit
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

embeddings:
  model: all-MiniLM-L6-v2   # 384-dim, fast, sentence-transformers
  chunk_size: 400            # Characters per chunk (Q+A pairs are short, no chunking needed usually)
  chunk_overlap: 50

qdrant:
  mode: file                 # Options: memory | file  (use 'memory' for quick testing)
  path: ./data/qdrant_store  # Persists between runs when mode=file
  collection_name: nust_bank_kb
  vector_size: 384           # Matches all-MiniLM-L6-v2 output dimension

retrieval:
  top_k: 5                   # Number of context chunks to retrieve per query
  score_threshold: 0.25      # Minimum cosine similarity to include a result

guardrails:
  max_input_length: 1000
  min_relevance_score: 0.25  # Below this = off-topic
  blocked_topics:
    - weapons
    - drugs
    - hacking
    - violence
    - illegal
  banking_keywords:
    - account
    - balance
    - transfer
    - loan
    - card
    - bank
    - finance
    - deposit
    - savings
    - mortgage
    - payment
    - interest
    - profit
    - rate
    - investment
    - credit
    - debit
    - insurance
    - remittance
    - digital
    - mobile
    - nust
    - atm
    - ibft
    - raast
    - beneficiary
    - cheque
    - statement
    - account
    - password
    - mpin
    - otp
    - transaction
    - limit
    - fee
    - charge
    - open
    - close
    - activate
    - deactivate
    - apply
    - eligible
    - document
    - minimum
    - maximum
    - currency
    - pkr
    - usd
    - top-up
    - bill
    - utility

data:
  raw_dir: ./data/raw
  processed_dir: ./data/processed
  knowledge_base_file: knowledge_base.json

app:
  title: "NUST Bank AI Assistant"
  subtitle: "Your intelligent banking support partner"
  bank_name: "NUST Bank"
  helpline: "+92 (51) 111 000 494"
  support_email: "support@NUSTbank.com.pk"
